name: Build Popsicle Kernel with SukiSU + SUSFS

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Clone kernel source
      run: |
        git clone --depth=1 -b popsicle-w-oss \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource \
          ~/kernel
        echo "Clone done."

    - name: Print repo structure
      run: |
        cd ~/kernel

        echo "====== ROOT FILES ======"
        ls -la

        echo ""
        echo "====== build_with_bazel.py ======"
        cat build_with_bazel.py 2>/dev/null || echo "NOT FOUND"

        echo ""
        echo "====== WORKSPACE / MODULE.bazel ======"
        cat WORKSPACE 2>/dev/null || cat MODULE.bazel 2>/dev/null || echo "NOT FOUND"

        echo ""
        echo "====== TOP-LEVEL DIRECTORIES ======"
        find . -maxdepth 1 -type d | sort

        echo ""
        echo "====== arch/arm64/configs/ ======"
        ls arch/arm64/configs/ 2>/dev/null | grep -i "popsicle\|gki\|sm8850\|defconfig" || echo "NOT FOUND"

        echo ""
        echo "====== ALL DEFCONFIGS ======"
        find . -name "*defconfig*" | sort

        echo ""
        echo "====== drivers/Makefile exists? ======"
        ls drivers/Makefile 2>/dev/null || echo "NOT FOUND"

        echo ""
        echo "====== BUILD.bazel files (top 10) ======"
        find . -name "BUILD.bazel" | head -10

        echo ""
        echo "====== msm_platforms.bzl ======"
        cat msm_platforms.bzl 2>/dev/null | head -50 || echo "NOT FOUND"

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: repo-structure
        path: /home/runner/kernel/build_with_bazel.py
        retention-days: 3