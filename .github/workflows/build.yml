name: Build Popsicle Kernel with SukiSU + SUSFS

on:
  workflow_dispatch:
    inputs:
      VARIANT:
        description: 'consolidate or perf'
        required: true
        default: 'consolidate'
        type: choice
        options:
          - consolidate
          - perf

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Maximize disk space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 8192
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git curl python3 python3-pip \
          bc bison flex libssl-dev libelf-dev libncurses-dev \
          make gcc clang-19 llvm-19 lld-19 \
          binutils-aarch64-linux-gnu \
          zip unzip cpio kmod libpython3-dev \
          openjdk-21-jdk-headless
        java -version

    - name: Set up workspace structure
      run: |
        mkdir -p ~/workspace
        cd ~/workspace

        echo ">>> Cloning soc-repo..."
        git clone --depth=1 -b popsicle-w-oss \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource \
          Xiaomi_Kernel_OpenSource
        ln -sf Xiaomi_Kernel_OpenSource soc-repo

        echo ">>> Cloning kernel/build..."
        git clone --depth=1 \
          https://android.googlesource.com/kernel/build \
          build

        echo ">>> Setting up Bazel..."
        mkdir -p tools
        BAZEL_VERSION=$(cat Xiaomi_Kernel_OpenSource/.bazelversion 2>/dev/null || echo "7.4.1")
        echo "Bazel version: $BAZEL_VERSION"
        curl -fsSL -o tools/bazel \
          "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-linux-x86_64"
        chmod +x tools/bazel
        ./tools/bazel --version

        echo ">>> Creating WORKSPACE at workspace root..."
        cp Xiaomi_Kernel_OpenSource/bazel.WORKSPACE WORKSPACE

        printf 'module(name = "msm_kernel", version = "0")\n' > MODULE.bazel

        if [ -f build/kernel/kleaf/MODULE.bazel ]; then
          echo ">>> Merging kleaf MODULE.bazel..."
          cat build/kernel/kleaf/MODULE.bazel >> MODULE.bazel
        fi

        echo ">>> Auto-fixing missing modules.bzl stubs..."
        cd ~/workspace/Xiaomi_Kernel_OpenSource
        python3 - << 'PYEOF'
        import os, re
        def find_bzl_imports(filepath):
            imports = []
            try:
                with open(filepath) as f:
                    for line in f:
                        m = re.findall(r'load\(["\'](?://[^:]+:)?([^"\']+\.bzl)["\']', line)
                        imports.extend(m)
            except: pass
            return imports
        root = os.getcwd()
        visited = set()
        to_check = []
        for dirpath, dirnames, filenames in os.walk(root):
            for f in filenames:
                if f == 'modules.bzl':
                    to_check.append(os.path.join(dirpath, f))
        created = 0
        while to_check:
            fpath = to_check.pop()
            if fpath in visited: continue
            visited.add(fpath)
            for imp in find_bzl_imports(fpath):
                # 兼容相对路径跳转
                imp_clean = imp.lstrip(':')
                abs_imp = os.path.normpath(os.path.join(root, imp_clean))
                if not os.path.exists(abs_imp):
                    os.makedirs(os.path.dirname(abs_imp), exist_ok=True)
                    with open(abs_imp, 'w') as stub:
                        stub.write('# Auto-generated stub\n')
                    print(f"Created stub: {abs_imp}")
                    created += 1
                    to_check.append(abs_imp)
        print(f"Total stubs created: {created}")
        PYEOF

        echo ">>> Final workspace structure:"
        ls -F ~/workspace/

    - name: Integrate SukiSU + SUSFS
      run: |
        cd ~/workspace/Xiaomi_Kernel_OpenSource
        echo ">>> Integrating SukiSU (with SUSFS)..."
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
          | bash -s main
        echo ">>> drivers/kernelsu contents:"
        ls drivers/kernelsu 2>/dev/null || echo "not found"

    - name: Build kernel
      run: |
        cd ~/workspace/Xiaomi_Kernel_OpenSource
        echo ">>> Starting build: popsicle ${{ github.event.inputs.VARIANT }}"
        python3 build_with_bazel.py \
          -t popsicle ${{ github.event.inputs.VARIANT }} \
          --log debug \
          2>&1 | tee ~/build.log
        echo ">>> Build exit: ${PIPESTATUS[0]}"

    - name: Find and package artifacts
      run: |
        KERNEL_IMG=$(find ~/workspace/out -name "Image" 2>/dev/null | head -1)
        if [ -z "$KERNEL_IMG" ]; then
          KERNEL_IMG=$(find ~/workspace -name "Image" -not -path "*/.git/*" -not -path "*/bazel-*" 2>/dev/null | head -1)
        fi
        if [ -z "$KERNEL_IMG" ]; then
          echo "ERROR: No kernel image found"
          tail -100 ~/build.log
          exit 1
        fi
        echo "Found: $KERNEL_IMG"
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ~/AnyKernel3
        cp "$KERNEL_IMG" ~/AnyKernel3/
        DTB_DIR=$(find ~/workspace/out -name "dtbs" -type d 2>/dev/null | head -1)
        if [ -n "$DTB_DIR" ]; then
          mkdir -p ~/AnyKernel3/dtbs
          cp -r "$DTB_DIR"/* ~/AnyKernel3/dtbs/ 2>/dev/null || true
        fi
        cd ~/AnyKernel3
        zip -r9 ~/popsicle-SukiSU-SUSFS-${{ github.event.inputs.VARIANT }}-${{ github.run_number }}.zip \
          . -x '*.git*'
        echo "Package done."

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: popsicle-${{ github.event.inputs.VARIANT }}-${{ github.run_number }}
        path: |
          ~/popsicle-SukiSU-SUSFS-*.zip
          ~/build.log
        retention-days: 7
