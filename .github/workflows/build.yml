name: Inspect kernel repo structure v2

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Clone and inspect
      run: |
        mkdir -p ~/workspace
        cd ~/workspace

        # clone soc-repo（你已知的）
        git clone --depth=1 -b popsicle-w-oss \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource \
          Xiaomi_Kernel_OpenSource

        echo "====== build.config.msm.popsicle ======"
        cat Xiaomi_Kernel_OpenSource/build.config.msm.popsicle

        echo ""
        echo "====== build.config.msm.sun (参考) ======"
        cat Xiaomi_Kernel_OpenSource/build.config.msm.sun

        echo ""
        echo "====== BUILD.bazel (前100行) ======"
        head -100 Xiaomi_Kernel_OpenSource/BUILD.bazel

        echo ""
        echo "====== bazel.WORKSPACE ======"
        cat Xiaomi_Kernel_OpenSource/bazel.WORKSPACE

        echo ""
        echo "====== build.targets ======"
        cat Xiaomi_Kernel_OpenSource/build.targets

        echo ""
        echo "====== target_variants.bzl ======"
        cat Xiaomi_Kernel_OpenSource/target_variants.bzl